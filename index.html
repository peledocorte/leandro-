<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Letreiro Deslizante Centralizado</title>

<style>
    /* Centraliza tudo na tela */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #e6e6e6;
        font-family: Arial, sans-serif;
    }

    /* Área da tela */
    #tela {
        width: 800px;           
        height: 150px;           
        border: 3px solid #333;
        overflow: hidden;
        background: #ffffff;
        position: relative;

        /* Centralizar interno */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Letreiro deslizante */
    #letreiro {
        position: absolute;
        white-space: nowrap;
        font-size: 28px;
        font-weight: bold;
        color: #0077cc;
    }
</style>
</head>
<body>

<div id="tela">
    <div id="letreiro">Acredite em si mesmo e tudo será possível!</div>
</div>

<script>
    const letreiro = document.getElementById("letreiro");
    const tela = document.getElementById("tela");

    let pos = 0;          // posição inicial 
    let direcao = 1;      // 1 = direita, -1 = esquerda
    const velocidade = 4; // velocidade fixa

    function animar() {
        pos += direcao * velocidade;

        const limiteDireita = tela.clientWidth - letreiro.clientWidth;

        // inverter direção ao bater na borda
        if (pos >= limiteDireita) direcao = -1;
        if (pos <= 0) direcao = 1;

        letreiro.style.left = pos + "px";
        requestAnimationFrame(animar);
    }

    animar();
</script>

</body>
</html>
